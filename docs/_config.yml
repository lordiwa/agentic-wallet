# Configuración de GitHub Pages para la landing de Agentic Wallet.
#
# El sitio se sirve desde main + /docs (modo "legacy": GitHub corre Jekyll solo,
# sin workflow de CI extra).
#
# CÓMO SE PUBLICAN LOS DOCUMENTOS CANÓNICOS
# -----------------------------------------
# instalar-en-windows.md, onboarding-para-humanos.md, oauth-para-humanos.md,
# conectar-gmail.md, multibanco.md, onboarding.md y mcp.md se publican SIN
# modificarlos: no llevan front matter ni marcadores de Jekyll. Funcionan gracias a plugins que GitHub Pages trae activados de fábrica:
#
#   - jekyll-optional-front-matter: convierte los .md sin front matter en
#     páginas igual. Por eso existe /onboarding-para-humanos.html.
#   - jekyll-relative-links: reescribe los enlaces .md entre documentos a la URL
#     de la página renderizada, así que los enlaces cruzados del markdown
#     canónico funcionan solos, sin JavaScript.
#
# El `defaults` de más abajo es lo único que hace falta para vestirlos: les
# aplica el layout del sitio sin tocar ni un byte del contenido. Los docs siguen
# siendo la fuente de verdad y se pueden reemplazar enteros sin que el sitio se
# entere.

title: Agentic Wallet
# Esta descripcion sale en la tarjeta al compartir el enlace, asi que es una
# promesa publica como cualquier otra. Decia "sin nube, sin cuenta, sin que tus
# datos salgan de tu maquina": con el servicio administrado eso dejo de ser
# cierto y se reescribio junto con la landing (docs/pivot-saas.md, Fase 0).
description: >-
  Tu copiloto financiero: lee los correos que tu banco ya te manda, arma tu
  historial de gastos y te deja preguntarle cosas en lenguaje natural. Como
  servicio administrado por nosotros, o corriéndolo vos en tu computadora.
lang: es

baseurl: "/agentic-wallet"
url: "https://lordiwa.github.io"

# Tarjeta de previsualización al compartir el enlace (og:image / twitter:image).
# Es una composición propia, 1200x630, con los colores de la marca — no una
# captura del dashboard, porque una captura no se lee a tamaño de miniatura.
og_image: "/assets/img/og-image.png"

repo_url: "https://github.com/lordiwa/agentic-wallet"
repo_blob: "https://github.com/lordiwa/agentic-wallet/blob/main"

# Navegación del header, toda anclas de la landing. "Privacidad" va antes que
# "Cómo se entra" a propósito: con el servicio administrado, lo que alguien
# tiene que poder leer antes de decidir es qué vemos y qué no.
nav:
  - title: Qué es
    url: "#que-es"
  - title: Cómo funciona
    url: "#como-funciona"
  - title: Cómo se ve
    url: "#pantallas"
  - title: Privacidad
    url: "#privacidad"
  - title: Cómo se entra
    url: "#acceso"
  - title: Preguntas
    url: "#faq"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      canonical: false

  - scope:
      path: "instalar-en-windows.md"
    values:
      title: Instalar el wallet en Windows
      kicker: Tres dobles clics, sin escribir un comando
      canonical: true

  - scope:
      path: "onboarding-para-humanos.md"
    values:
      title: Configurar tu wallet — guía para humanos
      kicker: Guía paso a paso, sin tecnicismos
      canonical: true

  - scope:
      path: "conectar-gmail.md"
    values:
      title: Conectar Gmail
      kicker: Permiso de solo lectura, una sola vez
      canonical: true

  - scope:
      path: "oauth-para-humanos.md"
    values:
      title: Darle permiso a tu Gmail
      kicker: Paso a paso para no técnicos
      canonical: true

  - scope:
      path: "multibanco.md"
    values:
      title: Soportar otro banco
      kicker: Documento técnico
      canonical: true

  - scope:
      path: "onboarding.md"
    values:
      title: Onboarding para agentes
      kicker: Documento técnico
      canonical: true

  - scope:
      path: "mcp.md"
    values:
      title: El wallet como herramientas MCP
      kicker: Documento técnico
      canonical: true

kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
